name: Deploy Gyanteerth to Elastic Beanstalk

on:
  # Deploy only after the existing CI workflow succeeds on main.
  workflow_run:
    workflows: ["Gyanteerth CI"]
    types: [completed]
    branches: [main]
  # Manual redeployment is restricted to main by the job condition and OIDC trust policy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gyanteerth-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: '237776193152'
      EB_APPLICATION_NAME: Gyanteerth
      EB_ENVIRONMENT_NAME: Gyanteerth-prod
      EB_S3_BUCKET: elasticbeanstalk-ap-south-1-237776193152
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERSION_LABEL: gyanteerth-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build production frontend and Express SSR bundle
        run: |
          npm run clean
          npm run build
        env:
          VITE_PUBLIC_URL: https://gyanteerth.in

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/server.bundle.mjs
          test -s dist/client/index.html
          test -d dist/bin
          test -s src/lib/contact-form.config.json
          echo "Production bundle validation passed."

      - name: Assemble and smoke-test the exact Elastic Beanstalk bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .eb-staging gyanteerth-eb.zip .eb-smoke.log .eb-smoke.pid
          mkdir -p .eb-staging/src/lib

          cat > .eb-staging/package.json <<'EOF'
          {
            "name": "gyanteerth",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "engines": { "node": ">=22.22.0" },
            "scripts": { "start": "node dist/server.bundle.mjs" }
          }
          EOF
          printf 'web: npm start\n' > .eb-staging/Procfile

          # The SSR build is bundled. Runtime files are dist/, plus the contact
          # form JSON which the handler reads relative to the app working dir.
          cp -a dist .eb-staging/
          cp src/lib/contact-form.config.json .eb-staging/src/lib/contact-form.config.json

          (
            cd .eb-staging
            zip -qr ../gyanteerth-eb.zip .
          )
          test -s gyanteerth-eb.zip

          (
            cd .eb-staging
            PORT=3107 NODE_ENV=production node dist/server.bundle.mjs > ../.eb-smoke.log 2>&1 &
            echo $! > ../.eb-smoke.pid
          )
          cleanup() {
            if [ -f .eb-smoke.pid ]; then
              kill "$(cat .eb-smoke.pid)" 2>/dev/null || true
              rm -f .eb-smoke.pid
            fi
          }
          trap cleanup EXIT

          health_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3107/api/health > /tmp/gyanteerth-health.json; then
              health_ok=true
              break
            fi
            sleep 1
          done
          if [[ "${health_ok}" != "true" ]]; then
            echo "Smoke-test server log:"
            cat .eb-smoke.log || true
            exit 1
          fi
          cat /tmp/gyanteerth-health.json
          if ! curl --fail --silent http://127.0.0.1:3107/ > /tmp/gyanteerth-homepage.html; then
            cat .eb-smoke.log || true
            exit 1
          fi
          grep -qi '<!doctype html' /tmp/gyanteerth-homepage.html
          if ! curl --fail --silent http://127.0.0.1:3107/sitemap.xml > /tmp/gyanteerth-sitemap.xml; then
            cat .eb-smoke.log || true
            exit 1
          fi
          grep -q '<urlset' /tmp/gyanteerth-sitemap.xml
          echo "Deployment bundle smoke tests passed."

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GyanteerthGitHubDeploy
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600

      - name: Upload source bundle to the application-specific S3 prefix
        shell: bash
        run: |
          set -euo pipefail
          S3_KEY="Gyanteerth/${VERSION_LABEL}.zip"
          echo "Uploading s3://${EB_S3_BUCKET}/${S3_KEY}"
          aws s3api put-object \
            --bucket "${EB_S3_BUCKET}" \
            --key "${S3_KEY}" \
            --body gyanteerth-eb.zip \
            --content-type application/zip \
            --region "${AWS_REGION}" \
            --no-cli-pager
          echo "S3 upload completed."

      - name: Create Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail
          S3_KEY="Gyanteerth/${VERSION_LABEL}.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --description "GitHub commit ${SOURCE_SHA}" \
            --source-bundle "S3Bucket=${EB_S3_BUCKET},S3Key=${S3_KEY}" \
            --no-auto-create-application \
            --region "${AWS_REGION}" \
            --no-cli-pager
          echo "Created application version ${VERSION_LABEL}."

      - name: Deploy version and wait for a healthy environment
        shell: bash
        run: |
          set -euo pipefail

          print_diagnostics() {
            echo ""
            echo "========== Elastic Beanstalk environment =========="
            aws elasticbeanstalk describe-environments \
              --environment-names "${EB_ENVIRONMENT_NAME}" \
              --region "${AWS_REGION}" \
              --query 'Environments[0].[EnvironmentName,Status,Health,HealthStatus,VersionLabel,StatusReason]' \
              --output table --no-cli-pager || true

            echo ""
            echo "========== Recent Elastic Beanstalk events =========="
            aws elasticbeanstalk describe-events \
              --environment-name "${EB_ENVIRONMENT_NAME}" \
              --max-records 40 \
              --region "${AWS_REGION}" \
              --query 'Events[*].[EventDate,Severity,Message]' \
              --output table --no-cli-pager || true
          }

          if ! aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --region "${AWS_REGION}" \
            --no-cli-pager; then
            echo "UpdateEnvironment API call failed."
            print_diagnostics
            exit 1
          fi

          # Poll only the Beanstalk environment API. This avoids asking the
          # deploy role to inspect CloudFormation stacks or Auto Scaling groups.
          for attempt in $(seq 1 90); do
            if ! environment_json=$(aws elasticbeanstalk describe-environments \
              --environment-names "${EB_ENVIRONMENT_NAME}" \
              --region "${AWS_REGION}" \
              --output json --no-cli-pager); then
              echo "Could not read Elastic Beanstalk environment status."
              print_diagnostics
              exit 1
            fi

            status=$(jq -r '.Environments[0].Status // "Unknown"' <<< "${environment_json}")
            health=$(jq -r '.Environments[0].Health // "Unknown"' <<< "${environment_json}")
            health_status=$(jq -r '.Environments[0].HealthStatus // "Unknown"' <<< "${environment_json}")
            deployed_version=$(jq -r '.Environments[0].VersionLabel // "Unknown"' <<< "${environment_json}")

            echo "Check ${attempt}/90: status=${status}; health=${health}; healthStatus=${health_status}; version=${deployed_version}"

            if [[ "${status}" == "Ready" && "${deployed_version}" == "${VERSION_LABEL}" && "${health}" == "Green" ]]; then
              echo "Gyanteerth deployed successfully and environment health is Green."
              exit 0
            fi

            if [[ "${status}" == "Terminating" || "${status}" == "Terminated" ]]; then
              echo "Environment entered ${status}."
              print_diagnostics
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for the requested application version to become Ready and Green."
          print_diagnostics
          exit 1
