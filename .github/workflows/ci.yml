name: Gyanteerth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository identifiers for AWS OIDC
        shell: bash
        run: |
          echo "Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --run

      - name: Build application
        run: npm run build
